<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>今天吃什么 · 点菜小工具</title>
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --line:#E8E3DC; --line2:#D8D2C9;
  --tx:#2C2C2A; --tx2:#78746E; --tx3:#A39E96;
  --brand:#D2691E; --brand-soft:#FBEDE2; --brand-line:#EBB98C;
  --ok:#2F7A4F; --ok-soft:#E6F3EA; --bad:#B33A3A; --bad-soft:#FBEAEA;
  --r:12px; --r2:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:110px;
}
button,input,textarea,select{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
img{display:block;max-width:100%}

header{
  position:sticky;top:0;z-index:50;background:rgba(250,249,247,.95);
  backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);padding:10px 16px 0;
}
.hrow{display:flex;align-items:center;gap:8px;max-width:1000px;margin:0 auto}
.logo{font-size:17px;font-weight:600;white-space:nowrap}
.logo span{color:var(--brand)}
.spacer{flex:1}
.nav{display:flex;gap:4px;background:#F1EEE9;border-radius:10px;padding:3px;max-width:1000px;margin:8px auto 0}
.nav button{flex:1;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--tx2);font-weight:500}
.nav button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--card);color:var(--tx2);flex:none;font-size:15px}
.ico:active{background:#F1EEE9}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;max-width:160px}
.me b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}

main{max-width:1000px;margin:0 auto;padding:14px 16px 20px}
.sec{margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:15px;font-weight:600;margin:0}
.sec .tip{font-size:12px;color:var(--tx3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line2);border-radius:10px;background:var(--card);outline:none}
.search input:focus{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.35;font-size:14px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13px;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;background:var(--tx);color:#fff;font-size:14px;font-weight:500}
.btn:active{opacity:.85}
.btn.gh{background:var(--card);color:var(--tx);border:1px solid var(--line2)}
.btn.br{background:var(--brand)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.dg{background:var(--card);color:var(--bad);border:1px solid #EBCFCF}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.dish .ph{aspect-ratio:4/3;background:#F4F1EC;display:grid;place-items:center;color:var(--tx3);font-size:13px;overflow:hidden}
.dish .ph img{width:100%;height:100%;object-fit:cover}
.dish .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.dish .nm{font-weight:500;font-size:15px;line-height:1.35}
.dish .rc{font-size:12.5px;color:var(--tx2);line-height:1.55;max-height:3.1em;overflow:hidden}
.tagx{display:inline-block;padding:2px 8px;border-radius:6px;background:#F1EEE9;color:var(--tx2);font-size:11.5px;align-self:flex-start}
.dish .ft{display:flex;align-items:center;gap:8px;margin-top:auto}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card)}
.qty button{width:32px;height:32px;font-size:17px;color:var(--tx2);display:grid;place-items:center}
.qty button:active{background:#F1EEE9}
.qty span{min-width:26px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.add{flex:1;height:32px;border-radius:9px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:500}
.add:active{opacity:.85}
.add.on{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line)}
.mini{display:flex;gap:6px;margin-top:2px}
.mini button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line2);font-size:12.5px;color:var(--tx2)}

.empty{padding:40px 20px;text-align:center;color:var(--tx3);font-size:14px}
.empty .big{font-size:15px;color:var(--tx2);margin-bottom:6px}

.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.06);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.cartbar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cartbar .ls{flex:1;font-size:13px;color:var(--tx2);line-height:1.45;max-height:42px;overflow:auto}
.cartbar .ls b{color:var(--tx);font-weight:500}
.cartbar .go{background:var(--brand);color:#fff;padding:11px 22px;border-radius:10px;font-weight:500;white-space:nowrap}
.freebox{display:flex;gap:8px;margin-top:14px}
.freebox input{flex:1;padding:10px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--card);outline:none}

.tabs{display:flex;gap:4px;background:#F1EEE9;border-radius:10px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border-radius:8px;font-size:14px;color:var(--tx2);font-weight:500;position:relative}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.badge{position:absolute;top:2px;right:14px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;font-weight:500}

.day{margin-bottom:18px}
.day .dh{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;color:var(--tx2);font-weight:500}
.day .dh .ln{flex:1;height:1px;background:var(--line)}
.rec{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px}
.rec .th{width:54px;height:54px;border-radius:9px;background:#F4F1EC;flex:none;overflow:hidden;display:grid;place-items:center;color:var(--tx3);font-size:11px}
.rec .th img{width:100%;height:100%;object-fit:cover}
.rec .bd{flex:1;min-width:0}
.rec .t1{display:flex;align-items:baseline;gap:8px}
.rec .t1 .n{font-weight:500;font-size:14.5px}
.rec .t1 .q{color:var(--brand);font-size:13px;font-weight:500}
.rec .t1 .tm{margin-left:auto;color:var(--tx3);font-size:12px;flex:none}
.rec .t2{font-size:12.5px;color:var(--tx2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pchip{display:inline-block;padding:1px 7px;border-radius:6px;background:#F1EEE9;color:var(--tx2);font-size:11.5px}
.pchip.dev{background:var(--brand-soft);color:var(--brand)}
.rec .ims{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.rec .ims img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.rec .ims .ad{width:52px;height:52px;border-radius:8px;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--tx3);font-size:18px;background:#FCFBFA}
.rec .rv{margin-top:7px;width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;background:#FCFBFA;resize:vertical;min-height:38px;outline:none}
.rec .rv:focus{border-color:var(--brand-line);background:#fff}
.rec .rv::placeholder{color:var(--tx3)}
.rec .ops{display:flex;gap:6px;margin-top:7px}

.stat{padding:14px}
.stat .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.kpi{background:#FCFBFA;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.kpi .v{font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--tx2);margin-top:2px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar .nb{flex:1;min-width:0}
.bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .t .c{color:var(--tx2);font-size:12px}
.bar .tr{height:7px;background:#F1EEE9;border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:4px}

.list{padding:4px 0}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .g{flex:1;min-width:0}
.row .g .n{font-size:14px;font-weight:500}
.row .g .s{font-size:12px;color:var(--tx2);margin-top:1px}
.prow{padding:13px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.ptop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pnm{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.pctl{display:flex;gap:8px;margin-top:10px;align-items:center}
.pctl select{flex:none;padding:8px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;outline:none;font-size:13px;color:var(--tx)}
.pctl input{flex:1;min-width:0;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;outline:none;font-size:13.5px;background:#fff}
.pctl input:focus{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
.prow .sw{margin-top:9px;display:inline-flex}
.crow{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:none}
.crow input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;outline:none;font-size:14px;background:#fff}
.crow input:focus{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
.roombig{text-align:center;padding:6px 0 14px}
.roombig .k{font-size:12.5px;color:var(--tx2);margin-bottom:4px}
.roombig .v{font-size:26px;font-weight:600;letter-spacing:2px;color:var(--brand)}
.addrow{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.addrow input{flex:1;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;outline:none}
.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap}
.sw input{width:16px;height:16px;accent-color:var(--brand)}

.mask{position:fixed;inset:0;z-index:100;background:rgba(30,28,26,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){
  .mask{align-items:center}
  .sheet{border-radius:16px;max-height:86vh}
}
.sheet h3{margin:0 0 14px;font-size:16px;font-weight:600}
.sheet .f{margin-bottom:13px}
.sheet label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
.sheet input[type=text],.sheet textarea,.sheet select{
  width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;outline:none;background:#fff;
}
.sheet textarea{resize:vertical;min-height:88px;line-height:1.6}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1;padding:11px}
.pv{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#F4F1EC;aspect-ratio:4/3;display:grid;place-items:center;color:var(--tx3);font-size:13px}
.pv img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--tx3);margin-top:6px;line-height:1.5}
.warn{background:var(--bad-soft);border:1px solid #EBCFCF;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.55}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.tt{background:rgba(44,44,42,.95);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.16);animation:tin .25s ease;line-height:1.45}
.tt b{font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.setup{max-width:520px;margin:40px auto;padding:0 18px}
.setup h1{font-size:22px;margin:0 0 6px}
.setup p{color:var(--tx2);font-size:13.5px;margin:0 0 18px;line-height:1.6}
.setup .card{padding:16px;margin-bottom:14px}
.setup .card h3{margin:0 0 10px;font-size:15px;font-weight:600}
.setup .card .muted,.setup .card p.muted{color:var(--tx2);font-size:13px;margin:0 0 12px;line-height:1.6}
.setup .steps{margin:0;padding-left:20px;font-size:13px;color:var(--tx2);line-height:1.75}
.setup .steps b{color:var(--tx);font-weight:600}
.setup .acts{margin-top:14px}
.errbox{background:var(--bad-soft);border:1px solid #EBCFCF;color:var(--bad);
  border-radius:10px;padding:11px 13px;font-size:13px;margin:0 0 16px;line-height:1.55}
.pchip.ok{background:var(--ok-soft);color:var(--ok);border-color:#BFDCC8}
.setup code{background:#F1EEE9;padding:1px 6px;border-radius:5px;font-size:12.5px}
.qr{display:flex;justify-content:center;padding:14px 0 4px}
.qr canvas{border-radius:10px;border:1px solid var(--line);padding:8px;background:#fff}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;font-size:12.5px;background:#FCFBFA;outline:none}

</style>

var S = {

/* ---------------- 本地存储（IndexedDB，图片够放） ---------------- */

  await DBI.set('st_' + S.room, {

/* ---------------- 小工具 ---------------- */

function pad(n) { return n < 10 ? '0' + n : '' + n; }

/* 依次尝试多个地址，第一个成功即可（本地文件优先，CDN 兜底） */
async function loadFirst(list) {

    'vendor/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://lib.baomitu.com/@supabase/supabase-js/2.45.4/umd/supabase.js'
  ]);

  max = max || 900; q = q || 0.7;

    var w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);

    var r = await S.sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' });

/* ---------------- 数据变更：本地生效 + 广播 + （可选）云端镜像 ---------------- */

function nowISO() { return new Date().toISOString(); }

async function mutate(op, table, rec) {
  var key = TM[table], arr = S[key];
  if (op === 'del') { S[key] = arr.filter(function (x) { return x.id !== rec.id; }); }
  else {
    if (table === 'orders' || table === 'dishes') rec.updated_at = nowISO();
    var i = arr.findIndex(function (x) { return x.id === rec.id; });
    if (i < 0) arr.unshift(rec);
    else arr[i] = (op === 'patch') ? Object.assign({}, arr[i], rec) : rec;
  }

  if (S.mode === 'sb') await sbMirror(op, table, rec);
  else SYNC.broadcast({ t: 'chg', op: op, table: table, rec: rec });

/* ---- Supabase 云端写入：按白名单取字段，用合并后的完整行做 upsert ---- */

var COLS = {
  dishes: ['id', 'room', 'name', 'category', 'recipe', 'image_url', 'sort_order', 'created_at', 'updated_at'],
  orders: ['id', 'room', 'dish_id', 'dish_name', 'qty', 'person_id', 'person_name', 'images', 'review', 'created_at', 'updated_at'],
  people: ['id', 'room', 'device_id', 'name', 'role', 'tag', 'tag_public', 'created_at'],
  categories: ['id', 'room', 'name', 'sort_order', 'created_at']

  if (table === 'orders') { out.dish_name = out.dish_name || '未命名'; out.qty = out.qty || 1; out.images = out.images || []; out.updated_at = out.updated_at || nowISO(); }
  if (table === 'people') { out.name = out.name || '匿名'; out.role = out.role || 'member'; out.device_id = out.device_id || ''; if (out.tag_public === undefined) out.tag_public = true; }

}

  if (!rec || !rec.id) return;
  var i = cur.findIndex(function (x) { return x.id === rec.id; });
  if (i < 0) { cur.unshift(rec); if (table === 'orders') noteNew(rec); }
  else {
    if (op === 'patch') cur[i] = Object.assign({}, cur[i], rec);
    else {
      var a = new Date(cur[i].updated_at || cur[i].created_at || 0).getTime();
      var b = new Date(rec.updated_at || rec.created_at || 0).getTime();

    var i = cur.findIndex(function (x) { return x.id === r.id; });
    if (i < 0) { cur.unshift(r); if (table === 'orders') noteNew(r); }
    else {
      var a = new Date(cur[i].updated_at || cur[i].created_at || 0).getTime();
      var b = new Date(r.updated_at || r.created_at || 0).getTime();
      if (b > a) cur[i] = r;
    }

}
function noteNew(o) {
  if (S.me && o.person_id === S.me.id) return;
  if (o._seen) return;
  o._seen = true;
  S.unread++;
  var who = o.person_name || '有人';
  toast('<b>' + esc(who) + '</b> 点了 ' + esc(o.dish_name) + ' ×' + o.qty);
  notify('有人点菜了', who + ' 点了 ' + o.dish_name + ' ×' + o.qty);
  refreshBadge();
}

/* ---------------- P2P 同步 ---------------- */

var SYNC = {
  peer: null, slot: -1, conns: {}, timer: null,
  async start() {
    if (!window.Peer) {
      try {
        await loadFirst([
          'vendor/peerjs.min.js',
          'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
          'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
        ]);
      } catch (e) {}
    }
    if (!window.Peer) { toast('直连组件加载失败，请检查网络'); return; }
    var key = roomKey(S.room);
    for (var i = 0; i < SLOTS; i++) {
      var p = await claim('dc' + key + '-' + i);
      if (p) { this.peer = p; this.slot = i; break; }

  dial() {
    var key = roomKey(S.room);

  broadcast(m) {

/* 把各种粘贴方式都归一到 https://<ref>.supabase.co */
function normUrl(u) {
  u = String(u == null ? '' : u).trim().replace(/\s/g, '');
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) {
    if (/^[a-z0-9]{15,}$/i.test(u)) return 'https://' + u + '.supabase.co';
    u = 'https://' + u;
  }
  try {
    var x = new URL(u);
    var m = x.pathname.match(/\/project\/([a-z0-9]+)/i);
    if (/supabase\.com$/i.test(x.hostname) && m) return 'https://' + m[1] + '.supabase.co';
    if (/supabase\.(co|in)$/i.test(x.hostname)) return x.protocol + '//' + x.hostname;
    return x.protocol + '//' + x.hostname;
  } catch (e) {
    return u.replace(/\/+$/, '');
  }
}
async function tryConnect(u, k) {
  try {
    await needSupabase();
    var base = normUrl(u);
    if (!base) return { ok: false, msg: 'Project URL 是空的' };
    var c = window.supabase.createClient(base, k);
    var r = await Promise.race([
      c.from('dishes').select('id').limit(1),
      new Promise(function (_, rj) { setTimeout(function () { rj(new Error('连接超时')); }, 12000); })
    ]);
    if (r.error) {
      var m = r.error.message || '';
      if (/Invalid path|requested path/i.test(m)) return { ok: false, msg: 'URL 带多了后缀，只需 https://xxx.supabase.co' };
      if (/does not exist|relation/i.test(m)) return { ok: false, msg: '数据表还没建，请先运行建表 SQL' };
      if (/JWT|API key|Invalid API|invalid claim/i.test(m)) return { ok: false, msg: 'anon key 不对，请重新复制' };
      if (/Failed to fetch|NetworkError|timeout|fetch failed/i.test(m)) return { ok: false, msg: '连不上，请检查 Project URL' };
      return { ok: false, msg: m };
    }
    return { ok: true, url: base };
  } catch (e) {
    var msg = (e && e.message) || '连接失败';
    if (/load fail|没能加载/i.test(msg)) return { ok: false, msg: '连接组件没加载出来，请检查网络后刷新页面' };
    if (/Load failed|Failed to fetch|NetworkError/i.test(msg)) return { ok: false, msg: '连不上 Supabase，请检查 Project URL 和网络' };
    return { ok: false, msg: msg };
  }

function drawQR(sel, text) {

function pageHTML() {
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  // 只清理紧贴 </head> 的那一块旧注入，避免误删脚本源码里的同名字符串
  html = html.replace(/<script[^>]*>\s*\/\*SHARE_CFG\*\/[\s\S]*?<\/script>\s*(?=<\/head>)/gi, '');
  var inject = '<' + 'script>/*SHARE_CFG*/(function(){try{' +
    'localStorage.setItem("dc_room",' + JSON.stringify(S.room) + ');' +
    'localStorage.setItem("dc_cfg",' + JSON.stringify(JSON.stringify(S.cfg)) + ');' +
    '}catch(e){}})();<' + '/script>';
  return /<\/head>/i.test(html) ? html.replace(/<\/head>/i, inject + '</head>') : inject + html;
}

async function doOrder(name, dishId, qty) {

    person_id: S.me ? S.me.id : null, person_name: S.me ? S.me.name : '我',

async function submitOrder() {
  var items = Object.keys(S.cart).filter(function (id) { return S.cart[id] > 0; });

  for (var i = 0; i < items.length; i++) {
    var d = S.dishes.find(function (x) { return x.id === items[i]; });

}

async function sbBoot() {
  await needSupabase();
  S.cfg.url = normUrl(S.cfg.url);
  S.sb = window.supabase.createClient(S.cfg.url, S.cfg.key);

  var r = await Promise.all([
    S.sb.from('people').select('*').eq('room', S.room),
    S.sb.from('dishes').select('*').eq('room', S.room),
    S.sb.from('orders').select('*').eq('room', S.room),
    S.sb.from('categories').select('*').eq('room', S.room)
  ]);
  var bad = r.find(function (x) { return x.error; });
  if (bad) {
    var m = bad.error.message || '';
    if (/does not exist|relation/i.test(m)) throw new Error('数据表还没建好，请先在 Supabase 里运行 supabase-setup.sql');
    if (/JWT|Invalid API key|No API key/i.test(m)) throw new Error('anon key 不对，请检查后重新填写');
    throw new Error(m || '连接失败');
  }
  var seen = { people: {}, dishes: {}, orders: {}, categories: {} };
  ['people', 'dishes', 'orders', 'categories'].forEach(function (t, i) {
    (r[i].data || []).forEach(function (x) { seen[t][x.id] = 1; });
  });
  mergeArr('people', r[0].data); mergeArr('dishes', r[1].data);
  mergeArr('orders', r[2].data); mergeArr('categories', r[3].data);

  var miss = [];
  ['categories', 'dishes', 'people', 'orders'].forEach(function (t) {
    S[TM[t]].forEach(function (x) { if (isUUID(x.id) && !seen[t][x.id]) miss.push([t, x]); });
  });
  for (var k = 0; k < miss.length; k++) {
    await S.sb.from(miss[k][0]).upsert(sbRow(miss[k][0], miss[k][1]));
  }
  if (miss.length) { toast('已把本机 ' + miss.length + ' 条数据上传到云端'); await persist(); }

  sbRealtime(true);
  S.sbOk = true; setSyncUI();
}

/* 实时推送：失败自动重试，重试期间用 5 秒轮询兜底 */
var RT = { tries: 0, poll: null, last: '', dead: false };
function sbRealtime(manual) {
  if (S.mode !== 'sb' || !S.sb) return;
  if (manual) RT.tries = 0;
  if (S.ch) { try { S.sb.removeChannel(S.ch); } catch (e) {} S.ch = null; }
  var f = 'room=eq.' + S.room;
  var ch = S.sb.channel('dc-' + Math.random().toString(36).slice(2, 8));
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'dishes', filter: f }, function (p) { sbEvent('dishes', p); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'categories', filter: f }, function (p) { sbEvent('categories', p); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'people', filter: f }, function (p) { sbEvent('people', p); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: f }, function (p) { sbEvent('orders', p); });
  S.ch = ch;
  ch.subscribe(function (st, err) {
    RT.last = st + (err ? ' · ' + (err.message || err) : '');
    if (st === 'SUBSCRIBED') {
      S.sbOk = true; RT.tries = 0; stopPoll(); setSyncUI(); return;
    }
    if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
      S.sbOk = false; setSyncUI(); startPoll();
      RT.tries++;
      if (RT.tries <= 4) {
        setTimeout(function () { if (S.mode === 'sb' && !S.sbOk) sbRealtime(false); }, [2500, 5000, 10000, 20000][RT.tries - 1]);
      } else if (!RT.dead) {
        RT.dead = true;
        toast('实时推送未连上，已改用 5 秒轮询（功能正常，延迟几秒）');
      }
    }
  });
}
function startPoll() {
  if (RT.poll) return;
  RT.poll = setInterval(function () {
    if (S.mode !== 'sb' || !S.sb || S.sbOk) return;
    sbPull();
  }, 5000);
}
function stopPoll() { if (RT.poll) { clearInterval(RT.poll); RT.poll = null; } }
async function sbPull() {
  try {
    var r = await Promise.all([
      S.sb.from('people').select('*').eq('room', S.room),
      S.sb.from('dishes').select('*').eq('room', S.room),
      S.sb.from('orders').select('*').eq('room', S.room),
      S.sb.from('categories').select('*').eq('room', S.room)
    ]);
    if (r.some(function (x) { return x.error; })) return;
    mergeArr('people', r[0].data); mergeArr('dishes', r[1].data);
    mergeArr('orders', r[2].data); mergeArr('categories', r[3].data);
    syncMe(); await persist(); softRender();
  } catch (e) {}
}
async function sbDiag() {
  try {
    var r = await S.sb.rpc('dc_realtime_status');
    if (r.error || !r.data) return null;
    return { miss: r.data.filter(function (x) { return !x.in_realtime; }).map(function (x) { return x.tablename; }) };
  } catch (e) { return null; }
}
function rtHint() {
  if (S.mode !== 'sb') return '';
  if (S.sbOk) return '<div class="hint">☁ 实时推送已连接，对方点菜你这边 1 秒内收到。</div>';
  var s = '<div class="hint"><b>⚠ 实时推送未连上</b>（数据照常保存，已启用 5 秒轮询兜底）<br>' +
    '状态：' + esc(RT.last || '未知') + '<br>' +
    '去 Supabase 检查：<b>Database → Replication</b>，把 dishes / orders / people / categories 四张表都勾上；' +
    '或者重新运行一次 supabase-setup.sql 的第 3 段。</div>';
  return s;
}
function sbEvent(table, p) {
  if (!p.new && !p.old) return;
  if (p.eventType === 'DELETE') applyRemote('del', table, { id: p.old.id });
  else { applyRemote('upsert', table, p.new); }
  syncMe(); persist(); softRender();
}
function setSyncUI() {
  var el = $('#pres'); if (!el) return;
  if (S.mode === 'sb') {
    el.className = 'pchip' + (S.sbOk ? ' ok' : '');
    el.textContent = S.sbOk ? '☁ 云端实时同步' : '☁ 未连接';
  } else {
    el.className = 'pchip';
    el.textContent = S.online + ' 人在线';
  }
}
async function sbPing() {
  if (!S.sb) return false;
  try {
    var r = await S.sb.from('categories').select('id').eq('room', S.room).limit(1);
    if (r.error) throw new Error(r.error.message);
    return true;
  } catch (e) { return false; }
}

/* ---------------- 启动 ---------------- */

function route() {
  var h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
  S.page = (h === 'admin') ? 'admin' : 'order';
}
function hashRoom() {
  var h = location.hash || '';
  var i = h.indexOf('?');
  if (i < 0) return null;
  try { return new URLSearchParams(h.slice(i + 1)).get('room'); } catch (e) { return null; }
}
window.addEventListener('hashchange', function () { route(); render(); });

async function askName(first) {
  return new Promise(function (done) {
    askText(first ? '你是第一个，登记一下称呼' : '登记一下称呼', '', '比如 小明 / 爸爸', async function (v) {
      var name = (v || '').trim() || (first ? '主人' : '客人');
      var row = {
        id: uid(), room: S.room, device_id: S.devId, name: name,
        role: S.people.length === 0 ? 'dev' : 'member', tag: null, tag_public: true, created_at: nowISO()
      };
      await mutate('upsert', 'people', row);
      S.me = row; syncMe();
      if (row.role === 'dev') toast('你是开发者，可以管理分类和用户备注');
      askNotify();
      done();
    }, '进入');
  });
}

async function boot() {
  S.devId = LS.get('dc_dev', '');
  if (!S.devId) { S.devId = uid(); LS.set('dc_dev', S.devId); }
  var qs = new URLSearchParams(location.search);
  S.room = qs.get('room') || hashRoom() || LS.get('dc_room', '') || 'home';
  LS.set('dc_room', S.room);
  S.cfg = LS.get('dc_cfg', null);
  route();

  if (!S.cfg) { $('#hdr').innerHTML = ''; $('#main').innerHTML = viewSetup(); return; }
  S.mode = S.cfg.mode === 'sb' ? 'sb' : 'p2p';

  var st = await DBI.get('st_' + S.room);
  if (st) {
    S.people = st.people || []; S.dishes = st.dishes || [];
    S.orders = st.orders || []; S.cats = st.cats || [];
    if (st.meId) S.me = S.people.find(function (p) { return p.id === st.meId; }) || null;
  }
  S.orders.forEach(function (o) { o._seen = true; });
  render();

  try {
    if (S.mode === 'sb') await sbBoot();
    else await SYNC.start();
  } catch (e) {
    S.bootErr = (e && e.message) || '连接失败';
    if (S.mode === 'sb') {
      $('#hdr').innerHTML = '';
      $('#main').innerHTML = viewSetup();
      $('#cartbar').innerHTML = '';
      return;
    }
    toast('直连失败：' + esc(S.bootErr));
  }

  syncMe();
  if (!S.me) {
    var had = S.people.length > 0;
    if (had) await sleep(2500);
    syncMe();
    if (!S.me) await askName(!had);
  }
  render();
}

boot();
})();

</script>
